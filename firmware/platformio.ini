; PEDAL. ESP32-C6 SuperMini — VS Code / PlatformIO
; The generic DevKitC manifest defaults to 8 MB; our SuperMini has 4 MB.
; pioarduino is required for the ESP32-C6 Arduino 3.x framework.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = default.csv
upload_protocol = esptool
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

; Main firmware: MQTT QoS 1, EEPROM journal, OTA, Wi-Fi.
[env:pedal_c6]
build_src_filter = +<main.cpp> +<Journal.cpp> -<sensor_probe.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.0
    256dpi/MQTT @ ^2.5.3

; Minimal diagnostic; no EEPROM/Wi-Fi or credentials required.
; Select env sensor_probe in VS Code's PlatformIO Project Tasks.
[env:sensor_probe]
build_src_filter = +<sensor_probe.cpp> -<main.cpp> -<Journal.cpp>
